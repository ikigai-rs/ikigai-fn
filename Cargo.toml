[package]
name = "ikigai-fn"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A library of reusable ikigai function endpoints (toUpper, reverseList, split, wrap, greet, echo, compose) — the first ikigai module crate, linkable into native and wasm32 hosts."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-fn"
homepage = "https://github.com/ikigai-rs/ikigai-fn"
readme = "README.md"
keywords = ["ikigai", "roc", "resolution", "module"]
categories = ["wasm"]

[dependencies]
# The released kernel, consumed from crates.io — the SAME version the hosts use,
# so a host links exactly one `ikigai-core` (no duplicate-crate type mismatch).
ikigai-core = "0.1.5"
async-trait = "0.1"
futures-util = "0.3"

[dev-dependencies]
futures = "0.3"
