[package]
name = "ikigai-fn"
version = "0.3.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A library of reusable ikigai function endpoints (toUpper, reverseList, split, wrap, greet, echo, compose, composeOver, conditional) — the first ikigai module crate, linkable into native and wasm32 hosts."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-fn"
homepage = "https://github.com/ikigai-rs/ikigai-fn"
readme = "README.md"
keywords = ["ikigai", "roc", "resolution", "module"]
categories = ["wasm"]

[dependencies]
# The released kernel, consumed from crates.io — the SAME version the hosts use,
# so a host links exactly one `ikigai-core` (no duplicate-crate type mismatch).
ikigai-core = "0.1.73" # a failed sub-request is a dependency (0.1.73), which is what makes a compose fallback cacheable AND cut when the missing part appears
async-trait = "0.1"
futures-util = "0.3"

[dev-dependencies]
futures = "0.3"
# The module recipe as one test (`tests/conformance.rs`): walks every bound
# endpoint and reports every violation at once. 0.2.0 adds `Suite::opt_out_check`,
# the per-CHECK waiver the two pass-through resolvers need (a whole-endpoint
# `opt_out` would drop ENFORCED and CACHEABLE with it).
ikigai-conformance = "0.2.0"
# Only the tests: `tests/declared_views.rs` proves named views against core's builder
# (`build`, `Registry`, `Topology::from_turtle`), which 0.1.83 added behind `declare`.
# The library itself needs nothing past 0.1.73 — a name is plain `Endpoint::name` — so
# the floor above stays where it is and no host is pulled forward by this crate.
ikigai-core = { version = "0.1.83", features = ["declare"] }
