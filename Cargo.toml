[package]
name = "ikigai-fn"
version = "0.11.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A library of reusable ikigai function endpoints (digest, markdown, toUpper, reverseList, html-to-text, split, wrap, greet, echo, compose, composeOver, conditional, each) — the first ikigai module crate, linkable into native and wasm32 hosts."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-fn"
homepage = "https://github.com/ikigai-rs/ikigai-fn"
readme = "README.md"
keywords = ["ikigai", "roc", "resolution", "module"]
categories = ["wasm"]

[dependencies]
# The released kernel, consumed from crates.io — the SAME version the hosts use,
# so a host links exactly one `ikigai-core` (no duplicate-crate type mismatch).
# 0.2.0 is the streams release (ledger #2261); the old 0.1 pin meant
# <0.2.0 under 0.x rules.
# 0.2.8 supplies contract-based reference settlement (K1, ledger #2511),
# required by compose marker <iri> arguments.
# 0.3.0 is the scoped content store (ledger #2965): held content is scoped to whoever
# delivered it. Nothing here calls `ContentStore::put` or `put_replay`.
ikigai-core = "0.3.0"
async-trait = "0.1"
futures-util = "0.3"
# `each` reads its collection with a typed deserializer (a seed that refuses a nested value
# at its first bracket), so `serde`'s traits and `serde_json`'s reader. Both 1.0, the only
# major there is; wasm-clean.
serde = "1.0"
serde_json = "1.0"
# `html::to_text` reads HTML that arrived as text (an RSS description) with Servo's WHATWG
# tokenizer rather than a hand-rolled one: references, broken tags, a stray `<` and the
# raw-text bodies of `script`/`style` read as a browser reads them. Pure Rust, wasm-clean.
html5ever = "0.40"
# `markdown` walks CommonMark events into its own XHTML, so the crate's HTML writer and its
# command-line parser stay out. Pure Rust, wasm-clean.
pulldown-cmark = { version = "0.13.6", default-features = false }

[dev-dependencies]
# Exercise REPL routing against this module's Meta contract on core 0.3.
ikigai-engine = "0.3.0"
futures = "0.3"
# `tests/markdown.rs` holds rendered fragments to an actual XML parser.
roxmltree = "0.20"
# The module recipe as one test (`tests/conformance.rs`): walks every bound
# endpoint and reports every violation at once. 0.12.0 enables BODIES
# and BODY-INPUTS by default, alongside the existing checks and per-check waivers.
# 0.14.0 is the one built on core 0.3.0, the scoped content store (ledger #2965).
ikigai-conformance = "0.14.0"
# Only the tests: `tests/declared_views.rs` proves named views against core's builder
# (`build`, `Registry`, `Topology::from_turtle`), which 0.1.83 added behind `declare`.
# 0.2.0 is the streams release (ledger #2261); the old 0.1 pin meant
# <0.2.0 under 0.x rules. Only the feature is test-only.
# 0.3.0 is the scoped content store (ledger #2965), matching the requirement above.
ikigai-core = { version = "0.3.0", features = ["declare"] }
