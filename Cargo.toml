[package]
name = "ikigai-fn"
version = "0.6.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A library of reusable ikigai function endpoints (toUpper, reverseList, split, wrap, greet, echo, compose, composeOver, conditional, each) — the first ikigai module crate, linkable into native and wasm32 hosts."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-fn"
homepage = "https://github.com/ikigai-rs/ikigai-fn"
readme = "README.md"
keywords = ["ikigai", "roc", "resolution", "module"]
categories = ["wasm"]

[dependencies]
# The released kernel, consumed from crates.io — the SAME version the hosts use,
# so a host links exactly one `ikigai-core` (no duplicate-crate type mismatch).
# 0.1.89: `space_iri`, and `bind` dropping a name, which is what lets `space()` name
# itself while a host that extends it stays anonymous. (0.1.73 was the floor before:
# a failed sub-request is a dependency, which makes a compose fallback cacheable AND
# cut when the missing part appears.) Under 0.x this caret is also a ceiling: <0.2.0.
ikigai-core = "0.1.110"
async-trait = "0.1"
futures-util = "0.3"
# `each` reads its collection with a typed deserializer (a seed that refuses a nested value
# at its first bracket), so `serde`'s traits and `serde_json`'s reader. Both 1.0, the only
# major there is; wasm-clean.
serde = "1.0"
serde_json = "1.0"

[dev-dependencies]
futures = "0.3"
# The module recipe as one test (`tests/conformance.rs`): walks every bound
# endpoint and reports every violation at once. 0.8.0 adds REQUIRED (each required
# input dropped must be a typed refusal) after 0.7.0's VALIDATE; 0.6.0 added
# SPACE-NAME (the `self_named_space` declaration); `Suite::opt_out_check` (0.2.0) is
# the per-CHECK waiver the two pass-through resolvers need (a whole-endpoint
# `opt_out` would drop ENFORCED and CACHEABLE with it). A 0.x caret: this admits
# <0.9.0 only.
ikigai-conformance = "0.8.0"
# Only the tests: `tests/declared_views.rs` proves named views against core's builder
# (`build`, `Registry`, `Topology::from_turtle`), which 0.1.83 added behind `declare`.
# The version matches the library floor above; only the feature is test-only.
ikigai-core = { version = "0.1.110", features = ["declare"] }
